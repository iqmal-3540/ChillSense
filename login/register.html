<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChillSense - Create Account</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container" style="max-width: 460px;">
        <div class="login-card">
            <!-- Header & Logo (Tanpa Badge Localhost Live) -->
            <div class="brand-header">
                <h1>ChillSense</h1>
                <p>Register New Retailer / F&B Operator Account</p>
            </div>

            <!-- Kotak Pesan Error / Sukses -->
            <div id="alertBox" class="alert-box" style="display: none;"></div>

            <!-- Form Register (Sesuai Tabel 4.6a & Wireframe) -->
            <form id="registerForm">
                <div class="input-group">
                    <label for="storeName">Store Name</label>
                    <input type="text" id="storeName" placeholder="e.g., FreshMart Mini Market" required>
                </div>

                <div class="input-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="operator@store.com" required>
                </div>

                <!-- Input Password dengan Ikon Mata -->
               <div class="input-group">
                  <label for="password">Password</label>
                  <div class="password-wrapper">
                       <input type="password" id="password" placeholder="Minimum 6 characters" required>
                        <button type="button" class="toggle-password" data-target="password" title="Show/Hide Password">
                       👁
                     </button>
                    </div>
               </div>

                <!-- Input Confirm Password dengan Tombol Show/Hide -->
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
                        <button type="button" class="toggle-password" data-target="confirmPassword" title="Show/Hide Password">
                           👁
                        </button>
                    </div>
                </div>

                <button type="submit" id="registerBtn" class="btn-signin" style="margin-top: 10px;">Register Account</button>
            </form>

            <!-- Footer Kembali ke Login -->
            <div class="login-footer">
                <p>Already have an account? <a href="login.html">Sign In here</a></p>
            </div>
        </div>
    </div>

    <script src="toggle.js"></script>
    <script type="module" src="register.js"></script>
</body>
</html>
