<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChillSense - Login</title>
    <link rel="stylesheet" href="login.css">
    
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Header & Logo -->
            <div class="brand-header">
                <h1>ChillSense</h1>
                <p>Smart Chiller Temperature & Energy Monitoring</p>
            </div>

            <!-- Kotak Pesan Error / Sukses -->
            <div id="alertBox" class="alert-box" style="display: none;"></div>

            <!-- Form Login -->
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="operator@store.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" data-target="password" title="Show/Hide Password">
                            👁
                        </button>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="reset-password.html" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" id="loginBtn" class="btn-signin">Sign In</button>
            </form>

            <!-- Footer Pendaftaran -->
            <div class="login-footer">
                <p>New F&B Operator or Retailer? <a href="register.html">Create an Account</a></p>
            </div>
        </div>
    </div>

    <!-- PENTING: mesti type="module" kerana login.js guna import -->
    <script src="toggle.js"></script>
    <script type="module" src="login.js"></script>
</body>
</html>
