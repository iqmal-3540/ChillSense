<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChillSense - Reset Password</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand-header">
                <h1>ChillSense</h1>
                <p>Enter your email and we'll send you a password reset link</p>
            </div>

            <div id="alertBox" class="alert-box" style="display: none;"></div>

            <form id="resetForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="operator@store.com" required>
                </div>

                <button type="submit" id="resetBtn" class="btn-signin">Send Reset Link</button>
            </form>

            <div class="login-footer">
                <p>Remembered your password? <a href="login.html">Back to Sign In</a></p>
            </div>
        </div>
    </div>

    <script type="module" src="reset-password.js"></script>
</body>
</html>
